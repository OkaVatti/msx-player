services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - mp3-network

  backend:
    build: ./backend
    ports:
      - "1323:1323"
    volumes:
      - ./backend:/app
      - ./music:/app/music:ro
      - ./data:/app/data
    environment:
      - DENO_ENV=production
    networks:
      - mp3-network

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
    working_dir: /app
    command: sh -c "npm install && npm run build"
    networks:
      - mp3-network

networks:
  mp3-network:
    driver: bridge

volumes:
  music:
  data: